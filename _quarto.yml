project:
  type: website
  render:
    - "*.qmd"
    - "notes/"
    - "outreach/"
    - "posts/"
    - "research/"
    - "!outreach/loop-quantum-gravity.qmd"
    - "!outreach/build-lqg.qmd"
    - "!outreach/lqg-atlas.qmd"
    - "!outreach/lqg-diagrams.qmd"
  pre-render:
    - python3 tools/build_lagrangian_catalogue.py
  resources:
    - CNAME
    - assets/lagrangian/**
website:
  site-url: "https://adierckx.com"
  title: "Antoine Dierckx"
  description: "Antoine Dierckx, PhD candidate in theoretical physics studying primordial black holes, their remnants, and the early universe."
  favicon: assets/css/logo-coffee.png
  drafts:
    - outreach/loop-quantum-gravity.qmd
    - outreach/build-lqg.qmd
    - outreach/lqg-atlas.qmd
    - outreach/lqg-diagrams.qmd
  page-footer:
    left: Antoine Dierckx
    right:
      - text: Email
        href: mailto:a.d@csic.es
      - text: arXiv
        href: https://arxiv.org/search/gr-qc?searchtype=author&query=Dierckx,+A
      - text: ORCID
        href: https://orcid.org/0009-0001-8717-1712
      - text: INSPIRE
        href: https://inspirehep.net/authors/3157664
  navbar:
    logo: assets/css/logo_bi_whiteteal_shad.svg
    collapse: true
    search: true
    left:
      - href: index.qmd
        text: Home
      - text: Research
        menu:
          - href: research/themes.qmd
            text: Research Themes
          - href: research/papers.qmd
            text: Publications
          - href: research/talks.qmd
            text: Talks & Slides
          - href: research/early-research.qmd
            text: Early Research
      - text: Notes and Resources
        menu:
          - href: notes/master.qmd
            text: Master Notes
          - href: notes/bachelor.qmd
            text: Bachelor Notes (FR)
          - href: notes/math.qmd
            text: Math Notes (FR)
      - href: outreach/projects.qmd
        text: Outreach & Projects
      - href: blog.qmd
        text: Blog
      - href: about.qmd
        text: About

format:
  html:
    theme: [darkly, assets/css/paper-dark.scss]
    css:
      - assets/css/styles.css
    toc: false
    code-fold: true
    html-math-method: mathjax
    anchor-sections: false
    grid:
      body-width: 1100px
    include-in-header:
      - text: '<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">'
      - text: '<script src="/assets/js/page-backgrounds.js"></script>'
